<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Básico -->
    <title>Inscripción y Contacto | QUALYLAB 2026</title>
    <meta name="description" content="Regístrate en QUALYLAB 2026. Elige tu modalidad: talleres precongreso, conferencias o ambos. Asegura tu lugar en el evento de calidad y salud pública más importante.">
    <meta name="keywords" content="inscripción QUALYLAB 2026, contacto congreso laboratorios, registro laboratorios, qualylabmx@gmail.com">
    <meta name="author" content="QUALYLAB">

    <!-- Open Graph -->
    <meta property="og:title" content="Inscripción y Contacto | QUALYLAB 2026">
    <meta property="og:description" content="Asegura tu lugar en QUALYLAB 2026. Participa en conferencias y talleres diseñados para transformar tu laboratorio.">
    <meta property="og:image" content="https://qualylab.qualitechai.com/10.webp">
    <meta property="og:url" content="https://qualylab.qualitechai.com/contacto.html">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>

    <body class="bg-light">

        <load src="/src/components/navbar.html" />

        <!-- CONTENEDOR PRINCIPAL -->
        <div class="pb-2 pt-5 mt-5">
            <!-- BARRA SUPERIOR CON LOGOS INSTITUCIONALES -->
            <div class="container pt-4 mb-4" data-aos="fade-down" data-aos-duration="800">
                <div class="row justify-content-between align-items-center">
                    <!-- Logo Izquierda (Guzmán) -->
                    <div class="col-auto">
                        <img src="/src/img/guzman-logo-2.webp"
                            alt="Guzmán Soluciones Integrales" height="60"
                            class="object-fit-contain">
                    </div>
                    <!-- Logo Derecha (Best) -->
                    <div class="col-auto">
                        <img src="/src/img/logo-best.webp" alt="Best Reference"
                            height="60"
                            class="object-fit-contain logo-best">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN FORMULARIO DE REGISTRO -->
            <main class="container my-4">

                <!-- Título Principal -->
                <div class="text-center mb-5" data-aos="fade-up">
                    <h1 class="font-monument titulo-contacto-seccion lh-sm">
                        Déjanos tus datos,<br>
                        nosotros nos encargamos del resto.
                    </h1>
                </div>

                <div class="row justify-content-center">
                    <div class="col-lg-8">

                        <!-- Tarjeta Blanca del Formulario -->
                        <div class="form-contacto-card p-4 p-md-5 position-relative" data-aos="zoom-in" data-aos-duration="900">
                            <form id="formContacto">

                                <!-- Inputs de Texto -->
                                <div class="mb-4">
                                    <input type="text"
                                        class="form-control input-contacto py-2 fw-bold"
                                        name="nombre"
                                        placeholder="Nombre" required>
                                </div>
                                <div class="mb-4">
                                    <input type="email"
                                        class="form-control input-contacto py-2 fw-bold"
                                        name="correo"
                                        placeholder="Correo electrónico"
                                        required>
                                </div>
                                <div class="mb-5">
                                    <input type="tel"
                                        class="form-control input-contacto py-2 fw-bold"
                                        name="telefono"
                                        placeholder="Teléfono" required>
                                </div>

                                <!-- Instrucción de Experiencia -->
                                <div
                                    class="text-center mb-4 font-montserrat fw-bold">
                                    <p class="text-secondary mb-0 lh-sm fs-4">
                                        Elige cómo quieres vivir la
                                        experiencia:
                                        <br>
                                        talleres, conferencias o ambos.
                                        ¡Regístrate y asegura tu lugar!
                                    </p>
                                </div>

                                <hr class="mb-4">

                                <!-- OPCIÓN 1: Conferencias -->
                                <div class="mb-4 p-3 rounded-3 bg-white">
                                    <div
                                        class="form-check align-items-start d-flex gap-3">
                                        <input class="form-check-input mt-1"
                                            type="checkbox" name="tipo_acceso[]"
                                            value="conferencias"
                                            id="opcionConferencias">
                                        <label
                                            class="form-check-label font-montserrat"
                                            for="opcionConferencias">
                                            <span
                                                class="d-block font-montserrat text-qualylab-purple text-center fw-bold mb-1 fs-4">
                                                Conferencias 26, 27 y 28 de
                                                octubre
                                            </span>
                                            <span class="text-center">
                                                Si solo quieres asistir a
                                                las conferencias con
                                                nuestros ponentes invitados,
                                                selecciona esta opción.
                                            </span>
                                        </label>
                                    </div>
                                </div>

                                <!-- OPCIÓN 2: Talleres - Congreso -->
                                <div class="mb-4 p-3 rounded-3 bg-white">
                                    <div
                                        class="form-check align-items-start d-flex gap-3 mb-3">
                                        <input class="form-check-input mt-1"
                                            type="checkbox" value="talleres"
                                            name="tipo_acceso[]"
                                            id="opcionTalleres">

                                        <!-- Contenedor para texto y select -->
                                        <div class="w-100">
                                            <label
                                                class="form-check-label font-montserrat w-100"
                                                for="opcionTalleres">
                                                <span
                                                    class="d-block font-montserrat text-qualylab-purple text-center fw-bold mb-1 fs-4">
                                                    Talleres - Congreso 26 y 27
                                                    de octubre
                                                </span>
                                                <span
                                                    class="d-block mb-3 text-center">
                                                    Si solo quieres participar
                                                    en talleres (sin acceso a
                                                    las conferencias),
                                                    elige el taller que más te
                                                    interese de la lista
                                                    desplegable.
                                                </span>
                                            </label>

                                            <!-- Selector FUERA del label -->
                                            <select id="selectTalleres"
                                                name="taller_seleccionado"
                                                class="form-select select-experiencia shadow-none fw-bold">
                                                <option selected disabled value>
                                                    Seleccionar el taller o
                                                    talleres en los que desea
                                                    participar
                                                </option>
                                                <option
                                                    value="Taller 1: Riesgos que generan valor">Taller
                                                    1: Riesgos que generan
                                                    valor</option>
                                                <option
                                                    value="Taller 2: IA para profesionales de laboratorio">Taller
                                                    2: IA para profesionales de
                                                    laboratorio</option>
                                                <option
                                                    value="Taller 3: Métodos bajo control">Taller
                                                    3: Métodos bajo
                                                    control</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <!-- OPCIÓN 3: Talleres + Conferencias -->
                                <div class="mb-4 p-3 rounded-3 bg-white">
                                    <div
                                        class="form-check align-items-start d-flex gap-3 mb-3">
                                        <input class="form-check-input mt-1"
                                            type="checkbox" value="ambos"
                                            name="tipo_acceso[]"
                                            id="opcionAmbos">

                                        <!-- Contenedor para texto y select -->
                                        <div class="w-100">
                                            <label
                                                class="form-check-label font-montserrat w-100"
                                                for="opcionAmbos">
                                                <span
                                                    class="d-block font-montserrat text-qualylab-purple text-center fw-bold mb-1 fs-4">
                                                    Talleres + Conferencias
                                                </span>
                                                <span
                                                    class="d-block mb-3 text-center">
                                                    Si quieres aprovechar al
                                                    máximo el evento y
                                                    participar tanto en talleres
                                                    como en conferencias,
                                                    selecciona esta opción.
                                                </span>
                                            </label>

                                            <!-- Selector FUERA del label -->
                                            <select id="selectAmbos"
                                                name="paquete_seleccionado"
                                                class="form-select select-experiencia shadow-none fw-bold">
                                                <option selected disabled value>
                                                    Seleccionar el taller o
                                                    talleres en los que desea
                                                    participar
                                                </option>
                                                <option
                                                    value="Paquete Esencial">Paquete
                                                    Esencial</option>
                                                <option
                                                    value="Paquete Premium">Paquete
                                                    Premium</option>
                                                <option
                                                    value="Paquete Experto">Paquete
                                                    Experto</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <!-- Acepto Términos y Condiciones -->
                                <div
                                    class="mb-4 form-check d-flex justify-content-end align-items-center gap-2">
                                    <input class="form-check-input"
                                        type="checkbox" value="aceptado"
                                        id="terminos"
                                        name="terminos" required>
                                    <label
                                        class="form-check-label font-montserrat"
                                        for="terminos">
                                        Acepto términos y condiciones.
                                    </label>
                                </div>

                                <!-- Botón de Envío -->
                                <div class="text-center pt-2" data-aos="fade-up" data-aos-delay="200">
                                    <button type="submit" id="btnEnviar"
                                        class="btn btn-enviar-contacto font-montserrat fw-bold py-2 px-5 rounded-pill">
                                        ENVIAR
                                    </button>
                                </div>

                            </form>
                        </div>

                    </div>
                </div>

            </main>

        </div>

        <load src="/src/components/footer.html" />
        <load src="/src/components/alerta.html" />
        <!-- Script de Vite -->
        <script type="module" src="/src/js/app.js"></script>
        <script type="module" src="/src/js/navbar.js"></script>
        <script type="module" src="/src/js/contact.js"></script>
    </body>

</html>
